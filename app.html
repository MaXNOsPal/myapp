<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกรายรับ-รายจ่าย</title>
<style>
  body { font-family: sans-serif; background:#f4f6f8; margin:0; padding:20px; }
  .container { max-width:500px; margin:0 auto; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
  .topbar button { background:#ef4444; color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; }
  .summary { display:flex; gap:10px; margin-bottom:20px; }
  .card { flex:1; background:#fff; padding:15px; border-radius:10px; text-align:center; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  .card.income h3 { color:#16a34a; }
  .card.expense h3 { color:#dc2626; }
  .card.balance h3 { color:#2563eb; }
  .form-box { background:#fff; padding:15px; border-radius:10px; margin-bottom:20px; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  select, input { width:100%; padding:10px; margin:6px 0; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; }
  .form-box button { width:100%; padding:10px; background:#4f46e5; color:#fff; border:none; border-radius:6px; cursor:pointer; margin-top:5px; }
  .list-item { background:#fff; padding:12px 15px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
  .list-item .amount.income { color:#16a34a; font-weight:bold; }
  .list-item .amount.expense { color:#dc2626; font-weight:bold; }
  .list-item .del { color:#999; cursor:pointer; font-size:13px; margin-left:10px; }
  .meta { font-size:12px; color:#888; }
</style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <h2>บันทึกรายรับ-รายจ่าย</h2>
    <button onclick="logout()">ออกจากระบบ</button>
  </div>

  <div class="summary">
    <div class="card income"><div>รายรับ</div><h3 id="totalIncome">0</h3></div>
    <div class="card expense"><div>รายจ่าย</div><h3 id="totalExpense">0</h3></div>
    <div class="card balance"><div>คงเหลือ</div><h3 id="totalBalance">0</h3></div>
  </div>

  <div class="form-box">
    <select id="type">
      <option value="income">รายรับ</option>
      <option value="expense">รายจ่าย</option>
    </select>
    <input type="number" id="amount" placeholder="จำนวนเงิน">
    <input type="text" id="category" placeholder="หมวดหมู่ (เช่น อาหาร, เงินเดือน)">
    <input type="text" id="note" placeholder="โน้ต (ไม่บังคับ)">
    <button onclick="addTransaction()">บันทึก</button>
  </div>

  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
