<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>รายการสิ่งที่อยากได้</title>
	<style>
		:root { --primary: #6d5dfc; --ink: #25243a; --muted: #77758a; --line: #e8e6f2; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; color: var(--ink); background: #f7f6fc; }
		.container { width: min(920px, 92%); margin: 0 auto; padding: 48px 0; }
		header { text-align: center; margin-bottom: 28px; }
		h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3rem); }
		header p { margin: 0; color: var(--muted); }
		.panel { background: white; border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: 0 8px 28px #332b7410; }
		form { display: grid; grid-template-columns: 1.4fr .8fr 1.5fr auto; gap: 12px; align-items: end; }
		label { display: block; font-size: .86rem; font-weight: bold; margin-bottom: 7px; }
		input { width:100%; padding: 12px 13px; border: 1px solid #dcd9e9; border-radius: 10px; font: inherit; outline: none; }
		input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px #6d5dfc1c; }
		button { border: 0; border-radius: 10px; padding: 13px 18px; color: white; background: var(--primary); font-weight: bold; cursor: pointer; white-space: nowrap; }
		button:hover { filter: brightness(.94); }
		.summary { display: flex; justify-content: space-between; align-items: center; margin: 28px 0 14px; }
		h2 { margin: 0; font-size: 1.25rem; }
		#count { color: var(--muted); font-size: .9rem; }
		#status { min-height: 20px; margin: 10px 0 0; color: var(--muted); font-size: .9rem; }
		#status.error { color: #c34861; }
		#items { display: grid; gap: 12px; }
		.item { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px 18px; background: white; border: 1px solid var(--line); border-radius: 13px; }
		.item h3 { margin: 0 0 6px; font-size: 1.05rem; }
		.price { color: var(--primary); font-weight: bold; }
		.item a { color: #4c43c7; font-size: .9rem; text-decoration: none; margin-left: 12px; }
		.delete { background: transparent; color: #c34861; padding: 7px 9px; }
		.empty { padding: 35px; text-align: center; color: var(--muted); background: white; border: 1px dashed #d9d5e8; border-radius: 13px; }
		.modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
		.modal.hidden { display: none; }
		.modal-card { width: min(1520px, 100%); background: white; border-radius: 18px; padding: 24px; box-shadow: 0 20px 45px rgba(15, 23, 42, .18); }
		.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
		.modal-head h3 { margin: 0; font-size: 1.2rem; }
		.close-btn { background: #e2e8f0; color: #334155; padding: 8px 10px; }
		.modal-form { display: grid; grid-template-columns: 1fr; gap: 14px; }
		.modal-form > div { display: grid; gap: 8px; }
		.modal-actions { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
		.modal-actions .ghost { background: #e2e8f0; color: #334155; }
		@media (max-width: 700px) { form { grid-template-columns: 1fr 1fr; } form .wide { grid-column: 1 / -1; } form button { width: 100%; } .item { align-items: flex-start; } .modal-actions { flex-direction: row; } .modal-actions button { width: 100%; } }
	</style>
</head>
<body>
	<main class="container">
		<header>
			<h1>สิ่งที่อยากได้</h1>
			<p>เก็บรายการของที่อยากซื้อไว้ในที่เดียว</p>
		</header>

		<section class="panel">
			<form id="wishForm">
				<div class="wide"><label for="name">สิ่งของที่อยากได้</label><input id="name" required placeholder="เช่น หูฟังไร้สาย" /></div>
				<div><label for="price">ราคาโดยประมาณ</label><input id="price" type="number" min="0" step="0.01" placeholder="0" /></div>
				<div><label for="link">ลิ้งสั่งซื้อ</label><input id="link" type="url" placeholder="https://..." /></div>
				<button type="submit">+ เพิ่มรายการ</button>
			</form>
		</section>

		<div class="summary"><h2>รายการของฉัน</h2><span id="count"></span></div>
		<p id="status" role="status"></p>
		<section id="items"></section>
	</main>

	<div id="editModal" class="modal hidden" aria-hidden="true">
		<div class="modal-card">
			<div class="modal-head">
				<h3>แก้ไขรายการ</h3>
				<button type="button" class="close-btn" id="closeEditModal">ปิด</button>
			</div>
			<form id="editForm" class="modal-form">
				<input id="editWishId" type="hidden" />
				<div>
					<label for="editName">สิ่งของที่อยากได้</label>
					<input id="editName" required />
				</div>
				<div>
					<label for="editPrice">ราคาโดยประมาณ</label>
					<input id="editPrice" type="number" min="0" step="any" />
				</div>
				<div>
					<label for="editLink">ลิ้งสั่งซื้อ</label>
					<input id="editLink" type="url" />
				</div>
				<div class="modal-actions">
					<button type="submit">บันทึกการแก้ไข</button>
					<button type="button" class="ghost" id="cancelEditModal">ยกเลิก</button>
					
				</div>
			</form>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="config.js"></script>
	<script>
		const form = document.querySelector('#wishForm');
		const items = document.querySelector('#items');
		const count = document.querySelector('#count');
		const status = document.querySelector('#status');
		const nameInput = document.querySelector('#name');
		const priceInput = document.querySelector('#price');
		const linkInput = document.querySelector('#link');
		const modal = document.querySelector('#editModal');
		const editForm = document.querySelector('#editForm');
		const editWishIdInput = document.querySelector('#editWishId');
		const editNameInput = document.querySelector('#editName');
		const editPriceInput = document.querySelector('#editPrice');
		const editLinkInput = document.querySelector('#editLink');
		const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
		let wishes = [];

		function render() {
			count.textContent = `${wishes.length} รายการ`;
			items.innerHTML = wishes.length ? wishes.map((wish) => `
				<article class="item">
					<div><h3>${escapeHtml(wish.name)}</h3><span class="price">${wish.price ? Number(wish.price).toLocaleString('th-TH') + ' บาท' : 'ไม่ระบุราคา'}</span>${wish.link ? ` <a href="${escapeHtml(wish.link)}" target="_blank" rel="noopener">ดูร้านค้า ↗</a>` : ''}</div>
					<div>
						<button type="button" class="edit" data-id="${wish.id}" onclick="editWish('${wish.id}')" aria-label="แก้ไขรายการ" style="background:#e0e7ff; color:#312e81; margin-right:8px;">แก้ไข</button>
						<button type="button" class="delete" data-id="${wish.id}" onclick="removeWish('${wish.id}')" aria-label="ลบรายการ">ลบ</button>
					</div>
				</article>`).join('') : '<div class="empty">ยังไม่มีรายการ ลองเพิ่มสิ่งของที่อยากได้รายการแรกเลย</div>';
		}
		function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char])); }
		function showError(message) { status.textContent = `เชื่อมต่อ Supabase ไม่สำเร็จ: ${message}`; status.className = 'error'; }
		function closeEditModal() {
			modal.classList.add('hidden');
			modal.setAttribute('aria-hidden', 'true');
			editForm.reset();
		}
		function openEditModal(wish) {
			editWishIdInput.value = wish.id;
			editNameInput.value = wish.name;
			editPriceInput.value = wish.price ?? '';
			editLinkInput.value = wish.link ?? '';
			modal.classList.remove('hidden');
			modal.setAttribute('aria-hidden', 'false');
			setTimeout(() => editNameInput.focus(), 50);
		}

		async function loadWishes() {
			const { data, error } = await db.from('wishes').select('id, name, price, link, created_at').order('created_at', { ascending: false });
			if (error) { showError(error.message); return; }
			wishes = data || [];
			status.textContent = 'เชื่อมต่อ Supabase แล้ว';
			status.className = '';
			render();
		}

		async function removeWish(id) {
			const normalizedId = String(id);
			if (!confirm('ลบรายการนี้หรือไม่?')) return;
			const { error } = await db.from('wishes').delete().eq('id', normalizedId);
			if (error) { showError(error.message); return; }
			await loadWishes();
		}

		async function editWish(id) {
			const normalizedId = String(id);
			const wish = wishes.find(item => String(item.id) === normalizedId);
			if (!wish) return;
			openEditModal(wish);
		}

		items.addEventListener('click', async (event) => {
			const editButton = event.target.closest('.edit');
			const deleteButton = event.target.closest('.delete');
			if (editButton) {
				const id = editButton.dataset.id;
				if (id) editWish(id);
				return;
			}
			if (deleteButton) {
				const id = deleteButton.dataset.id;
				if (id) await removeWish(id);
			}
		});

		form.addEventListener('submit', async event => {
			event.preventDefault();
			const button = form.querySelector('button[type="submit"]');
			button.disabled = true;
			status.textContent = 'กำลังบันทึก...';
			status.className = '';
			const { error } = await db.from('wishes').insert({
				name: nameInput.value.trim(),
				price: priceInput.value ? Number(priceInput.value) : null,
				link: linkInput.value.trim() || null
			});
			button.disabled = false;
			if (error) { showError(error.message); return; }
			form.reset();
			nameInput.focus();
			await loadWishes();
		});

		editForm.addEventListener('submit', async event => {
			event.preventDefault();
			const id = editWishIdInput.value;
			if (!id) return;
			const payload = {
				name: editNameInput.value.trim(),
				price: editPriceInput.value ? Number(editPriceInput.value) : null,
				link: editLinkInput.value.trim() || null
			};
			const { error } = await db.from('wishes').update(payload).eq('id', id);
			if (error) { showError(error.message); return; }
			closeEditModal();
			await loadWishes();
		});

		document.querySelector('#closeEditModal').addEventListener('click', closeEditModal);
		document.querySelector('#cancelEditModal').addEventListener('click', closeEditModal);
		modal.addEventListener('click', (event) => {
			if (event.target === modal) closeEditModal();
		});
		loadWishes();
	</script>
</body>
</html>
